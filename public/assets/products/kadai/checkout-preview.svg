<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Kadai checkout preview</title>
  <desc id="description">An illustrative shop checkout with sample grocery items, barcode lookup, branch stock, and GST total.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#f7fee7"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop stop-color="#15803d"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#14532d" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#background)"/>
  <circle cx="1090" cy="595" r="170" fill="#bbf7d0" opacity=".55"/>
  <circle cx="80" cy="60" r="125" fill="#d9f99d" opacity=".65"/>
