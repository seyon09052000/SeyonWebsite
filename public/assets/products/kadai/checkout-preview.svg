  <text x="818" y="345" fill="#64748b" font-family="Arial,sans-serif" font-size="14">GST</text>
  <text x="1074" y="345" text-anchor="end" fill="#334155" font-family="Arial,sans-serif" font-size="14">Included</text>
  <line x1="818" y1="369" x2="1074" y2="369" stroke="#e2e8f0" stroke-width="2"/>
  <text x="818" y="405" fill="#14532d" font-family="Arial,sans-serif" font-size="15" font-weight="700">Total due</text>
  <text x="1074" y="408" text-anchor="end" fill="#15803d" font-family="Arial,sans-serif" font-size="23" font-weight="700">₹1,845</text>
  <rect x="818" y="437" width="256" height="54" rx="12" fill="url(#green)"/>
  <text x="946" y="470" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">COMPLETE SALE</text>
  <rect x="818" y="511" width="256" height="44" rx="11" fill="#fefce8" stroke="#fde68a"/>
  <circle cx="840" cy="533" r="7" fill="#eab308"/>
  <text x="857" y="538" fill="#854d0e" font-family="Arial,sans-serif" font-size="12" font-weight="700">OFFLINE-READY CHECKOUT</text>
</svg>
