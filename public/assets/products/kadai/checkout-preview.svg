  <text x="541" y="441" text-anchor="middle" fill="#334155" font-family="Arial,sans-serif" font-size="14">1</text>
  <text x="730" y="441" text-anchor="end" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">₹365</text>
