<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Invoicely invoice preview</title>
  <desc id="description">An illustrative retail invoice with sample items, tax, payment status, and stock confirmation.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="total" x1="0" x2="1">
      <stop stop-color="#0284c7"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#164e63" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#backdrop)"/>
  <circle cx="1095" cy="65" r="118" fill="#bae6fd" opacity=".45"/>
  <circle cx="108" cy="635" r="170" fill="#cffafe" opacity=".6"/>
  <rect x="54" y="46" width="1092" height="583" rx="26" fill="#fff" filter="url(#shadow)"/>
  <path d="M80 46h1040a26 26 0 0 1 26 26v66H54V72a26 26 0 0 1 26-26Z" fill="#f0f9ff"/>
  <rect x="84" y="76" width="43" height="43" rx="13" fill="#0284c7"/>
  <path d="M96 87h19v22l-9.5-5-9.5 5Z" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="142" y="105" fill="#0c4a6e" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="1.5">INVOICELY</text>
  <text x="1008" y="103" text-anchor="end" fill="#64748b" font-family="Arial,sans-serif" font-size="14">BILLS  ·  STOCK  ·  REPORTS</text>
  <rect x="86" y="165" width="684" height="414" rx="17" fill="#fff" stroke="#dbeafe" stroke-width="2"/>
  <text x="116" y="207" fill="#0f172a" font-family="Arial,sans-serif" font-size="24" font-weight="700">TAX INVOICE</text>
  <text x="116" y="235" fill="#64748b" font-family="Arial,sans-serif" font-size="14">Sample Retail Shop</text>
  <text x="740" y="204" text-anchor="end" fill="#64748b" font-family="Arial,sans-serif" font-size="13">BILL NO.</text>
  <text x="740" y="231" text-anchor="end" fill="#0f172a" font-family="Arial,sans-serif" font-size="18" font-weight="700">INV-00042</text>
  <line x1="116" y1="257" x2="740" y2="257" stroke="#e2e8f0" stroke-width="2"/>
  <text x="116" y="287" fill="#64748b" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">DESCRIPTION</text>
  <text x="532" y="287" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">QTY</text>
  <text x="740" y="287" text-anchor="end" fill="#64748b" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">AMOUNT</text>
  <rect x="108" y="303" width="640" height="50" rx="9" fill="#f8fafc"/>
  <text x="126" y="334" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">Grocery essentials</text>
  <text x="532" y="334" text-anchor="middle" fill="#475569" font-family="Arial,sans-serif" font-size="15">2</text>
  <text x="730" y="334" text-anchor="end" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">₹980.00</text>
  <text x="126" y="386" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">Household supplies</text>
  <text x="532" y="386" text-anchor="middle" fill="#475569" font-family="Arial,sans-serif" font-size="15">1</text>
  <text x="730" y="386" text-anchor="end" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">₹1,450.00</text>
  <rect x="108" y="405" width="640" height="50" rx="9" fill="#f8fafc"/>
  <text x="126" y="436" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">Cleaning products</text>
  <text x="532" y="436" text-anchor="middle" fill="#475569" font-family="Arial,sans-serif" font-size="15">4</text>
  <text x="730" y="436" text-anchor="end" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">₹1,850.00</text>
  <line x1="446" y1="475" x2="740" y2="475" stroke="#e2e8f0" stroke-width="2"/>
  <text x="462" y="506" fill="#64748b" font-family="Arial,sans-serif" font-size="14">Tax / GST</text>
  <text x="740" y="506" text-anchor="end" fill="#64748b" font-family="Arial,sans-serif" font-size="14">Included</text>
  <text x="462" y="546" fill="#0f172a" font-family="Arial,sans-serif" font-size="17" font-weight="700">TOTAL</text>
  <text x="740" y="546" text-anchor="end" fill="#0284c7" font-family="Arial,sans-serif" font-size="24" font-weight="700">₹4,280.00</text>
  <rect x="802" y="177" width="302" height="194" rx="18" fill="#0c4a6e"/>
  <text x="832" y="216" fill="#bae6fd" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">BILL SUMMARY</text>
  <text x="832" y="267" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">₹4,280</text>
  <text x="832" y="294" fill="#dbeafe" font-family="Arial,sans-serif" font-size="14">Ready to share or print</text>
  <rect x="832" y="318" width="142" height="30" rx="15" fill="#cffafe"/>
  <circle cx="849" cy="333" r="5" fill="#0891b2"/>
  <text x="862" y="338" fill="#155e75" font-family="Arial,sans-serif" font-size="12" font-weight="700">STOCK UPDATED</text>
  <rect x="802" y="393" width="302" height="148" rx="18" fill="#fff" stroke="#bae6fd" stroke-width="2"/>
  <circle cx="845" cy="438" r="20" fill="#e0f2fe"/>
  <path d="m835 438 7 7 14-15" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="879" y="434" fill="#0f172a" font-family="Arial,sans-serif" font-size="16" font-weight="700">One shop, one record</text>
  <text x="879" y="459" fill="#64748b" font-family="Arial,sans-serif" font-size="13">Bills and stock stay in sync.</text>
  <rect x="832" y="486" width="242" height="36" rx="10" fill="url(#total)"/>
  <text x="953" y="510" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="700">WHATSAPP  ·  PDF  ·  PRINT</text>
</svg>
