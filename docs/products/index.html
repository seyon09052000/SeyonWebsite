<!doctype html><html lang="en"><head><meta charset="utf-8"><script>window.SEYON_STATIC=true</script><script>document.documentElement.dataset.theme='light'</script><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Products | Seyon Solutions</title><meta name="description" content="Browse every Seyon Solutions software product by category, status, platform and industry.">
<link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/premium.css"><link rel="stylesheet" href="/ios.css"><link rel="stylesheet" href="/screens.css"><link rel="stylesheet" href="/color.css"><link rel="stylesheet" href="/bg.css"><link rel="stylesheet" href="/header.css"><link rel="stylesheet" href="/theme.css"></head><body>
<div id="nav"></div>
<section class="page-hero"><div class="wrap"><span class="eyebrow">Our software</span><h1>Software directory</h1><p>Search and filter every product by category, status, platform and industry.</p></div></section>
<section class="s"><div class="wrap">
<div class="filters">
  <input id="q" type="search" placeholder="Search products…" aria-label="Search">
  <select id="fc" aria-label="Category"><option value="">All categories</option></select>
  <select id="fs" aria-label="Status"><option value="">All statuses</option></select>
  <select id="fp" aria-label="Platform"><option value="">All platforms</option></select>
  <select id="fi" aria-label="Industry"><option value="">All industries</option></select>
</div>
<div class="row" style="margin-bottom:18px;align-items:center;gap:12px;flex-wrap:wrap"><label for="so" style="margin:0">Sort</label><select id="so" style="width:auto"><option value="featured">Featured first</option><option value="name">Name A–Z</option><option value="status">Status</option></select><button type="button" id="clearFilters" class="btn" style="padding-block:8px;padding-inline:14px">Clear filters</button><span class="chip" id="count" aria-live="polite"></span></div>
<div class="grid" id="list"></div></div></section>
<div id="foot"></div>
<script src="/app.js"></script><script src="/screens.js"></script>
<script>
(async()=>{await layout('products');const {products}=await catalog();
const uniq=a=>[...new Set(a)].sort();
const fill=(id,vals,lab)=>{document.getElementById(id).insertAdjacentHTML('beforeend',vals.map(v=>`<option value="${esc(v)}">${esc(lab?lab(v):v)}</option>`).join(''))};
fill('fc',uniq(products.map(p=>p.category)));fill('fs',uniq(products.map(p=>p.status)),s=>(STATUS[s]||[s])[0]);
fill('fp',uniq(products.flatMap(p=>p.platforms)));fill('fi',uniq(products.flatMap(p=>p.industries||[])));
const params=new URLSearchParams(location.search);if(params.get('category'))fc.value=params.get('category');
const rank={live:0,public_beta:1,private_beta:2,coming_soon:3,in_development:4,draft:5,deprecated:6};
function render(){const q=document.getElementById('q').value.toLowerCase();
let r=products.filter(p=>(!q||(p.name+p.tagline+p.overview).toLowerCase().includes(q))&&(!fc.value||p.category===fc.value)&&(!fs.value||p.status===fs.value)&&(!fp.value||p.platforms.includes(fp.value))&&(!fi.value||(p.industries||[]).includes(fi.value)));
const s=so.value;r.sort((a,b)=>s==='name'?a.name.localeCompare(b.name):s==='status'?rank[a.status]-rank[b.status]:(b.featured-a.featured)||a.name.localeCompare(b.name));
count.textContent=r.length+' product'+(r.length===1?'':'s');
list.innerHTML=r.length?r.map(card).join(''):'<div class="empty" style="grid-column:1/-1">No products match these filters.</div>';
if (window.seyonAnalytics) {
  window.seyonAnalytics.track('product_search', {
    query: q,
    category: fc.value || null,
    status: fs.value || null,
    platform: fp.value || null,
    industry: fi.value || null,
    results: r.length
  });
}}
['q','fc','fs','fp','fi','so'].forEach(i=>document.getElementById(i).addEventListener('input',render));
document.getElementById('clearFilters').addEventListener('click',()=>{
  ['q','fc','fs','fp','fi','so'].forEach((id)=>{const el=document.getElementById(id); if (el.tagName === 'SELECT') el.value=''; else el.value='';});
  render();
});
render();})();
</script></body></html>
